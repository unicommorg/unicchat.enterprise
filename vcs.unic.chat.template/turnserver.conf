listening-port=3478
tls-listening-port=5349

# Example for a server behind NAT. Replace both addresses with real values.
listening-ip=192.168.1.10
relay-ip=192.168.1.10
external-ip=203.0.113.10/192.168.1.10

min-port=30000
max-port=40000

fingerprint
use-auth-secret
static-auth-secret=example-turn-shared-secret-change-me
realm=turn.example.com
server-name=turn.example.com

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

stale-nonce=600
no-cli
no-multicast-peers
no-dtls
syslog
simple-log
