port: 7880
bind_addresses:
    - ""

rtc:
    tcp_port: 7881

    port_range_start: 50000
    port_range_end: 60000

    use_external_ip: false
    # Example public IP from RFC 5737. Replace it with the server public IP.
    node_ip: "203.0.113.10"

    enable_loopback_candidate: false
    allow_tcp_fallback: true
 
    turn_servers:
      - host: turn.example.com
        port: 3478
        protocol: udp
        secret: "example-turn-shared-secret-change-me"
        ttl: 14400

      - host: turn.example.com
        port: 5349
        protocol: tls
        secret: "example-turn-shared-secret-change-me"
        ttl: 14400

redis:
    address: localhost:6379
    username: ""
    password: ""
    db: 0
    use_tls: false
    sentinel_master_name: ""
    sentinel_username: ""
    sentinel_password: ""
    sentinel_addresses: []
    cluster_addresses: []
    max_redirects: null

turn:
    enabled: false
    domain: turn.example.com

    tls_port: 5349
    udp_port: 3478
    external_tls: true
    relay_range_start: 30000
    relay_range_end: 40000

keys:
    example-api-key: example-livekit-api-secret-change-me
