# Один сервер: docker compose up -d  (CI: --wait, список сервисов — README §2.7)
# Несколько серверов: compose.<роль>.yml — README шаг 2a.
# Образы — IMAGE_* в .env.

services:
  # --- MongoDB ---
  unicchat-mongodb:
    image: ${IMAGE_MONGODB}
    container_name: unicchat-mongodb
    restart: always
    environment:
      MONGODB_REPLICA_SET_MODE: ${MONGODB_REPLICA_SET_MODE}
      MONGODB_REPLICA_SET_NAME: ${MONGODB_REPLICA_SET_NAME}
      MONGODB_REPLICA_SET_KEY: ${MONGODB_REPLICA_SET_KEY}
      MONGODB_PORT_NUMBER: ${MONGODB_PORT_NUMBER}
      # MONGODB_INITIAL_PRIMARY_HOST: ${MONGODB_INITIAL_PRIMARY_HOST}
      # MONGODB_INITIAL_PRIMARY_PORT_NUMBER: ${MONGODB_INITIAL_PRIMARY_PORT_NUMBER}
      MONGODB_ADVERTISED_HOSTNAME: ${MONGODB_ADVERTISED_HOSTNAME}
      MONGODB_ENABLE_JOURNAL: ${MONGODB_ENABLE_JOURNAL}
      MONGODB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongodb_data:/bitnami/mongodb
    networks:
      - unicchat-network
    healthcheck:
      test: echo 'db.hello().isWritablePrimary || db.hello().ismaster' | mongosh localhost:27017/test --quiet | grep true || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "27017:27017"

  # --- Vault ---
  unicchat-vault:
    image: ${IMAGE_VAULT}
    container_name: unicchat-vault
    restart: always
    depends_on:
      vault-mongo-init:
        condition: service_completed_successfully
    command: server
    environment:
      MongoCS: "mongodb://${VAULT_DB_USER}:${VAULT_DB_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT_NUMBER}/${VAULT_DB_NAME}?directConnection=true&authSource=${VAULT_DB_NAME}&replicaSet=${MONGODB_REPLICA_SET_NAME}&authMechanism=SCRAM-SHA-256"
      api.logger.url: http://unicchat-logger:8080/
    volumes:
      - vault-data:/vault/file/
    networks:
      - unicchat-network
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1/ >/dev/null 2>&1 || wget -q -O /dev/null http://127.0.0.1/ || bash -c 'echo >/dev/tcp/127.0.0.1/80'",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  vault-mongo-init:
    image: ${IMAGE_MONGODB}
    container_name: vault-mongo-init
    restart: "no"
    depends_on:
      unicchat-mongodb:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
          until mongosh "mongodb://root:$${MONGODB_ROOT_PASSWORD}@unicchat-mongodb:27017/admin?replicaSet=$${MONGODB_REPLICA_SET_NAME}&authSource=admin" \
            --eval "db.hello().isWritablePrimary || db.hello().ismaster" --quiet | grep true >/dev/null 2>&1
          do
            echo "Waiting for MongoDB primary..."
            sleep 5
          done

          echo "Checking if Vault user exists..."

          mongosh "mongodb://root:$${MONGODB_ROOT_PASSWORD}@unicchat-mongodb:27017/admin?replicaSet=$${MONGODB_REPLICA_SET_NAME}&authSource=admin" --eval "
            const dbName = '$${VAULT_DB_NAME}';
            const userName = '$${VAULT_DB_USER}';
            const password = '$${VAULT_DB_PASSWORD}';

            const dbx = db.getSiblingDB(dbName);

            if (!dbx.getUser(userName)) {
              print('User does not exist, creating...');

              dbx.createUser({
                user: userName,
                pwd: password,
                roles: [
                  { role: 'readWrite', db: dbName }
                ]
              });

              print('Vault user created');
            } else {
              print('Vault user already exists, skipping');
            }
          "

          echo "Checking if Tasker user exists..."

          mongosh "mongodb://root:$${MONGODB_ROOT_PASSWORD}@unicchat-mongodb:27017/admin?replicaSet=$${MONGODB_REPLICA_SET_NAME}&authSource=admin" --eval "
            const dbName = '$${TASKER_DB_NAME}';
            const userName = '$${TASKER_DB_USER}';
            const password = '$${TASKER_DB_PASSWORD}';

            const dbx = db.getSiblingDB(dbName);

            if (!dbx.getUser(userName)) {
              print('User does not exist, creating...');

              dbx.createUser({
                user: userName,
                pwd: password,
                roles: [
                  { role: 'readWrite', db: dbName }
                ]
              });

              print('Tasker user created');
            } else {
              print('Tasker user already exists, skipping');
            }
          "
          echo "Done."
    environment:
      VAULT_DB_USER: ${VAULT_DB_USER}
      VAULT_DB_PASSWORD: ${VAULT_DB_PASSWORD}
      VAULT_DB_NAME: ${VAULT_DB_NAME}
      TASKER_DB_USER: ${TASKER_DB_USER}
      TASKER_DB_PASSWORD: ${TASKER_DB_PASSWORD}
      TASKER_DB_NAME: ${TASKER_DB_NAME}
      MONGODB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGODB_REPLICA_SET_NAME: ${MONGODB_REPLICA_SET_NAME}
    networks:
      - unicchat-network

  vault-init:
    image: ${IMAGE_VAULT_INIT}
    container_name: vault-init
    restart: "no"
    depends_on:
      unicchat-vault:
        condition: service_healthy
      unicchat-mongodb:
        condition: service_healthy
      unicchat-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
          echo "Waiting for Vault..."
          until VAULT_TOKEN="$$(curl -fsS "$${VAULT_URL}$${VAULT_TOKEN_PATH}?username=$${VAULT_TOKEN_USERNAME}")" && [ -n "$${VAULT_TOKEN}" ]; do
            sleep 5
          done

          echo "Vault token received."

          MONGO_PORT="$${MONGODB_PORT_NUMBER:-27017}"

          read_secret_data() {
            curl -sS -o "$$1" -w "%{http_code}" \
              -H "Authorization: Bearer $${VAULT_TOKEN}" \
              "$${VAULT_URL}api/Secrets/KBTConfigs/data" || true
          }

          read_secret_object() {
            curl -sS -o "$$1" -w "%{http_code}" \
              -H "Authorization: Bearer $${VAULT_TOKEN}" \
              "$${VAULT_URL}api/Secrets/KBTConfigs" || true
          }

          check_dependencies() {
            DEP_ATTEMPT=1

            while [ "$${DEP_ATTEMPT}" -le "$${VAULT_INIT_RETRIES}" ]; do
              MONGO_OK=0
              MINIO_OK=0
              curl -sS -o /dev/null --max-time 5 "http://$${KBT_MONGO_HOST}:$${MONGO_PORT}/" && MONGO_OK=1 || true
              curl -fsS -o /dev/null --max-time 5 "http://$${MINIO_HOST}/minio/health/live" && MINIO_OK=1 || true

              if [ "$${MONGO_OK}" = 1 ] && [ "$${MINIO_OK}" = 1 ]; then
                echo "MongoDB $${KBT_MONGO_HOST}:$${MONGO_PORT} and MinIO $${MINIO_HOST} answer."
                return 0
              fi

              echo "Waiting for dependencies ($${DEP_ATTEMPT}/$${VAULT_INIT_RETRIES}): mongo=$${MONGO_OK} minio=$${MINIO_OK}"
              DEP_ATTEMPT="$$(($${DEP_ATTEMPT} + 1))"
              sleep "$${VAULT_INIT_RETRY_DELAY}"
            done

            return 1
          }

          verify_secret() {
            SECRET_BODY="$$(mktemp)"
            SECRET_CODE="$$(read_secret_object "$${SECRET_BODY}")"

            if [ "$${SECRET_CODE}" != "200" ]; then
              rm -f "$${SECRET_BODY}"
              echo "WARNING: cannot read KBTConfigs back, HTTP $${SECRET_CODE}. Addresses not compared."
              return 0
            fi

            if ! grep -q "MongoCS" "$${SECRET_BODY}"; then
              rm -f "$${SECRET_BODY}"
              echo "WARNING: KBTConfigs response has no MongoCS field. Addresses not compared."
              return 0
            fi

            MISMATCH=0
            grep -q "@$${KBT_MONGO_HOST}:" "$${SECRET_BODY}" || MISMATCH=1
            grep -q "\"MinioHost\":\"$${MINIO_HOST}\"" "$${SECRET_BODY}" || MISMATCH=1
            rm -f "$${SECRET_BODY}"

            if [ "$${MISMATCH}" = 0 ]; then
              echo "Secret matches .env: mongo=$${KBT_MONGO_HOST} minio=$${MINIO_HOST}"
              return 0
            fi

            echo "WARNING: KBTConfigs in Vault does not match .env (expected mongo=$${KBT_MONGO_HOST} minio=$${MINIO_HOST})."
            echo "WARNING: Tasker keeps the stored addresses. Recreate the secret by hand, see README, section 'Секрет Vault KBTConfigs'."
            return 0
          }

          ATTEMPT=1

          while [ "$${ATTEMPT}" -le "$${VAULT_INIT_RETRIES}" ]; do
            echo "Checking KBTConfigs secret... attempt $${ATTEMPT}/$${VAULT_INIT_RETRIES}"

            RESPONSE_BODY="$$(mktemp)"
            HTTP_CODE="$$(read_secret_data "$${RESPONSE_BODY}")"

            if [ "$${HTTP_CODE}" = "200" ]; then
              rm -f "$${RESPONSE_BODY}"
              echo "KBTConfigs secret already exists."
              verify_secret
              exit 0
            fi

            rm -f "$${RESPONSE_BODY}"

            if ! check_dependencies; then
              echo "MongoDB or MinIO is not reachable from vault-init. KBTConfigs secret NOT created."
              echo "Check KBT_MONGO_HOST and KBT_MINIO_HOST in .env, then start vault-init again."
              exit 1
            fi

            echo "Creating KBTConfigs secret..."

            RESPONSE_BODY="$$(mktemp)"
            HTTP_CODE="$$(curl -sS -o "$${RESPONSE_BODY}" -w "%{http_code}" -X POST "$${VAULT_URL}api/Secrets" \
              -H "Authorization: Bearer $${VAULT_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "accept: text/plain" \
              -d "{
                \"id\": \"KBTConfigs\",
                \"name\": \"KBTConfigs\",
                \"type\": \"Password\",
                \"data\": \"All info in META\",
                \"metadata\": {
                  \"MongoCS\": \"mongodb://$${TASKER_DB_USER}:$${TASKER_DB_PASSWORD}@$${KBT_MONGO_HOST}:27017/$${TASKER_DB_NAME}?directConnection=true&authSource=$${TASKER_DB_NAME}&authMechanism=SCRAM-SHA-256&replicaSet=$${MONGODB_REPLICA_SET_NAME}\",
                  \"MinioHost\": \"$${MINIO_HOST}\",
                  \"MinioUser\": \"$${MINIO_USER}\",
                  \"MinioPass\": \"$${MINIO_PASSWORD}\"
                },
                \"tags\": [\"KB\", \"Tasker\", \"Mongo\", \"Minio\"],
                \"expiresAt\": \"2030-12-31T23:59:59.999Z\"
              }" || true)"

            if [ "$${HTTP_CODE}" -ge 200 ] && [ "$${HTTP_CODE}" -lt 300 ]; then
              rm -f "$${RESPONSE_BODY}"
              echo "KBTConfigs secret created."
              verify_secret
              exit 0
            fi

            echo "Vault is not ready to create KBTConfigs yet. HTTP $${HTTP_CODE}:"
            cat "$${RESPONSE_BODY}"
            rm -f "$${RESPONSE_BODY}"

            ATTEMPT="$$(($${ATTEMPT} + 1))"
            sleep "$${VAULT_INIT_RETRY_DELAY}"
          done

          echo "Failed to create KBTConfigs secret after $${VAULT_INIT_RETRIES} attempts."
          exit 1
    environment:
      VAULT_URL: ${API_VAULT_URL}
      VAULT_TOKEN_PATH: api/token/0f8e160416b94225a73f86ac23b9118b
      VAULT_TOKEN_USERNAME: KBTservice
      TASKER_DB_USER: ${TASKER_DB_USER}
      TASKER_DB_PASSWORD: ${TASKER_DB_PASSWORD}
      TASKER_DB_NAME: ${TASKER_DB_NAME}
      MINIO_HOST: ${KBT_MINIO_HOST:-unicchat-minio:9000}
      MINIO_USER: ${MINIO_ROOT_USER}
      MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD}
      KBT_MONGO_HOST: ${KBT_MONGO_HOST:-unicchat-mongodb}
      MONGODB_PORT_NUMBER: ${MONGODB_PORT_NUMBER:-27017}
      MONGODB_REPLICA_SET_NAME: ${MONGODB_REPLICA_SET_NAME}
      VAULT_INIT_RETRIES: 10
      VAULT_INIT_RETRY_DELAY: 5
    networks:
      - unicchat-network

  # --- AppServer ---
  unicchat-appserver:
    image: ${IMAGE_APPSERVER}
    container_name: unicchat-appserver
    restart: always
    depends_on:
      unicchat-mongodb:
        condition: service_healthy
    environment:
      CREATE_TOKENS_FOR_USERS: true
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT_NUMBER}
      DB_COLLECTIONS_PREFIX: ${DB_COLLECTIONS_PREFIX}
      UNIC_SOLID_HOST: ${UNIC_SOLID_HOST}
      PORT: ${PORT}
      DEPLOY_METHOD: ${DEPLOY_METHOD}
      MONGO_URL: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT_NUMBER}/${MONGODB_DATABASE}?replicaSet=${MONGODB_REPLICA_SET_NAME}
      MONGO_OPLOG_URL: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT_NUMBER}/local
      ROOT_URL: ${ROOT_URL}
      DOCUMENT_SERVER_HOST: https://${DOCUMENTSERVER_SERVER_NAME}
      LICENSE_HOST: ${LICENSE_HOST}
    volumes:
      - chat_data:/app/uploads
    networks:
      - unicchat-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => { let d=''; r.on('data', c => d+=c); r.on('end', () => process.exit(r.statusCode === 200 && d.includes('ok') ? 0 : 1)); }).on('error', () => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    ports:
      - "8080:3000"

  # --- Logger ---
  unicchat-logger-postgres:
    image: ${IMAGE_POSTGRES}
    container_name: unicchat-logger-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOGGER_DB_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - logger_postgres_data:/var/lib/postgresql
    networks:
      - unicchat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    expose:
      - "5432"

  logger-postgres-init:
    image: ${IMAGE_POSTGRES}
    container_name: logger-postgres-init
    restart: "no"
    depends_on:
      unicchat-logger-postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
          echo "Waiting for logger postgres..."
          until pg_isready -h unicchat-logger-postgres -U postgres >/dev/null 2>&1; do
            sleep 2
          done

          echo "Ensuring logger role and database..."
          psql -h unicchat-logger-postgres -U postgres -d postgres \
            -c "CREATE ROLE $${LOGGER_DB_USER} LOGIN PASSWORD '$${LOGGER_DB_PASSWORD}';" \
            || echo "logger role already exists"
          psql -h unicchat-logger-postgres -U postgres -d postgres \
            -c "CREATE DATABASE $${LOGGER_DB} OWNER $${LOGGER_DB_USER};" \
            || echo "logger database already exists"
          psql -h unicchat-logger-postgres -U postgres -d postgres \
            -c "GRANT ALL PRIVILEGES ON DATABASE $${LOGGER_DB} TO $${LOGGER_DB_USER};"
          echo "Logger postgres user ready."
    environment:
      LOGGER_DB_USER: ${LOGGER_DB_USER}
      LOGGER_DB_PASSWORD: ${LOGGER_DB_PASSWORD}
      LOGGER_DB: ${LOGGER_DB}
    networks:
      - unicchat-network

  unicchat-logger:
    image: ${IMAGE_LOGGER}
    container_name: unicchat-logger
    restart: always
    depends_on:
      unicchat-logger-postgres:
        condition: service_healthy
      logger-postgres-init:
        condition: service_completed_successfully
    environment:
      Storage__ConnectionString: "Host=${LOGGER_PG_HOST};Port=${LOGGER_PG_PORT};Database=${LOGGER_DB};Username=${LOGGER_DB_USER};Password=${LOGGER_DB_PASSWORD}"
      api.logger.url: ${API_LOGGER_URL}
    networks:
      - unicchat-network
    ports:
      - "8082:8080"

  # --- Tasker ---
  unicchat-tasker:
    image: ${IMAGE_TASKER}
    container_name: unicchat-tasker
    restart: always
    depends_on:
      vault-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8881:8080"
    environment:
      api.vault.url: ${API_VAULT_URL}
      api.logger.url: ${API_LOGGER_URL}
    networks:
      - unicchat-network

  # --- Nginx ---
  nginx-config-init:
    image: ${IMAGE_NGINX}
    container_name: nginx-config-init
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
          VARS='$${APP_SERVER_NAME} $${DOCUMENTSERVER_SERVER_NAME} $${MINIO_SERVER_NAME} $${SSL_CERT} $${SSL_KEY} $${DOCUMENTSERVER_SSL_CERT} $${DOCUMENTSERVER_SSL_KEY} $${MINIO_SSL_CERT} $${MINIO_SSL_KEY} $${UNICCHAT_HOST} $${PORT} $${DOCUMENT_SERVER_PROXY} $${MINIO_HOST} $${MINIO_PORT} $${ROOT_URL}'
          mkdir -p /conf.d
          for t in 00-app 10-documentserver 20-minio; do
            envsubst "$$VARS" < "/templates/$${t}.conf.template" > "/conf.d/$${t}.conf"
          done
    environment:
      ROOT_URL: ${ROOT_URL}
      APP_SERVER_NAME: ${APP_SERVER_NAME}
      UNICCHAT_HOST: ${UNICCHAT_HOST}
      PORT: ${NGINX_APP_PORT:-${PORT}}
      SSL_CERT: ${SSL_CERT}
      SSL_KEY: ${SSL_KEY}
      DOCUMENTSERVER_SERVER_NAME: ${DOCUMENTSERVER_SERVER_NAME}
      DOCUMENT_SERVER_PROXY: ${DOCUMENT_SERVER_PROXY}
      DOCUMENTSERVER_SSL_CERT: ${DOCUMENTSERVER_SSL_CERT}
      DOCUMENTSERVER_SSL_KEY: ${DOCUMENTSERVER_SSL_KEY}
      MINIO_SERVER_NAME: ${MINIO_SERVER_NAME}
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_SSL_CERT: ${MINIO_SSL_CERT}
      MINIO_SSL_KEY: ${MINIO_SSL_KEY}
    volumes:
      - ./nginx/templates:/templates:ro
      - ./nginx/conf.d:/conf.d
    networks:
      - unicchat-network

  unicchat-nginx:
    image: ${IMAGE_NGINX}
    container_name: unicchat-nginx
    restart: always
    depends_on:
      unicchat-appserver:
        condition: service_healthy
      nginx-config-init:
        condition: service_completed_successfully
    environment:
      ROOT_URL: ${ROOT_URL}
      APP_SERVER_NAME: ${APP_SERVER_NAME}
      UNICCHAT_HOST: ${UNICCHAT_HOST}
      PORT: ${NGINX_APP_PORT:-${PORT}}
      SSL_CERT: ${SSL_CERT}
      SSL_KEY: ${SSL_KEY}
      # SSL_CERTIFICATE_FILE_IN_BASE64: ${SSL_CERTIFICATE_FILE_IN_BASE64}
      # SSL_CERTIFICATE_KEY_FILE_IN_BASE64: ${SSL_CERTIFICATE_KEY_FILE_IN_BASE64}
      DOCUMENTSERVER_PROXY_ENABLE: ${DOCUMENTSERVER_PROXY_ENABLE}
      DOCUMENTSERVER_SERVER_NAME: ${DOCUMENTSERVER_SERVER_NAME}
      DOCUMENT_SERVER_PROXY: ${DOCUMENT_SERVER_PROXY}
      DOCUMENTSERVER_SSL_CERT: ${DOCUMENTSERVER_SSL_CERT}
      DOCUMENTSERVER_SSL_KEY: ${DOCUMENTSERVER_SSL_KEY}
      MINIO_PROXY_ENABLE: ${MINIO_PROXY_ENABLE}
      MINIO_SERVER_NAME: ${MINIO_SERVER_NAME}
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_SSL_CERT: ${MINIO_SSL_CERT}
      MINIO_SSL_KEY: ${MINIO_SSL_KEY}
    volumes:
      - ./certs:/certs
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"
    networks:
      - unicchat-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /etc/nginx/conf.d/00-app.conf && test -s /etc/nginx/conf.d/10-documentserver.conf && test -s /etc/nginx/conf.d/20-minio.conf && nginx -t",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- MinIO ---
  unicchat-minio:
    image: ${IMAGE_MINIO}
    container_name: unicchat-minio
    restart: always
    command: server --console-address ":9002" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: ${MINIO_BROWSER}
      # MINIO_DOMAIN: ${MINIO_DOMAIN}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # S3 API
      - "9002:9002"  # Web Console
    networks:
      - unicchat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: ${IMAGE_MINIO_MC}
    container_name: minio-init
    restart: "no"
    depends_on:
      unicchat-minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
          mc alias set local "http://unicchat-minio:9000" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"

          echo "Creating bucket $${MINIO_BUCKET}..."
          mc mb --ignore-existing "local/$${MINIO_BUCKET}"

          # DocumentServer stores rendered documents here and reads them anonymously
          echo "Creating bucket $${MINIO_DOCS_BUCKET}..."
          mc mb --ignore-existing "local/$${MINIO_DOCS_BUCKET}"
          mc anonymous set public "local/$${MINIO_DOCS_BUCKET}"

          echo "Done."
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-unicchat-files}
      MINIO_DOCS_BUCKET: ${MINIO_DOCS_BUCKET:-uc.onlyoffice.docs}
    networks:
      - unicchat-network

  # --- Knowledgebase: DocumentServer ---
  unicchat-documentserver:
    image: ${IMAGE_DOCUMENTSERVER}
    container_name: unicchat-documentserver
    restart: always
    depends_on:
      unicchat-postgresql:
        condition: service_healthy
      unicchat-rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ALLOW_META_IP_ADDRESS: true
      JWT_ENABLED: ${JWT_ENABLED}
      JWT_SECRET: ${JWT_SECRET}
      JWT_HEADER: ${JWT_HEADER}
      DB_TYPE: ${DB_TYPE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      AMQP_URI: ${AMQP_URI}
      ALLOW_PRIVATE_IP_ADDRESS: ${ALLOW_PRIVATE_IP_ADDRESS}
    volumes:
      - documentserver_data:/var/www/uniceditor/Data
      - documentserver_log:/var/log/uniceditor
      - documentserver_cache:/var/lib/uniceditor/documentserver/App_Data/cache/files
      - documentserver_files:/var/www/uniceditor/documentserver-example/public/files
      - documentserver_fonts:/usr/share/fonts
    networks:
      - unicchat-network
    stdin_open: true
    stop_grace_period: 60s
    ports:
      - "8880:80"
      - "8443:443"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck | grep -q true"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  unicchat-rabbitmq:
    image: ${IMAGE_RABBITMQ}
    container_name: unicchat-rabbitmq
    restart: always
    expose:
      - "5672"
    networks:
      - unicchat-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  unicchat-postgresql:
    image: ${IMAGE_POSTGRES}
    container_name: unicchat-postgresql
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgresql_data:/var/lib/postgresql
    expose:
      - "5432"
    networks:
      - unicchat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  unicchat-network:
    name: unicchat-network

volumes:
  mongodb_data:
    driver: local
  chat_data:
    driver: local
  vault-data:
    driver: local
  minio_data:
    driver: local
  documentserver_data:
    driver: local
  documentserver_log:
    driver: local
  documentserver_cache:
    driver: local
  documentserver_files:
    driver: local
  documentserver_fonts:
    driver: local
  postgresql_data:
    driver: local
  logger_postgres_data:
    driver: local
