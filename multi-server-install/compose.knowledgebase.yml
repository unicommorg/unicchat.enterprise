# Роль Knowledgebase. Запуск: docker compose -f compose.knowledgebase.yml up -d
# Образы — IMAGE_* в .env.
services:
  unicchat-documentserver:
    image: ${IMAGE_DOCUMENTSERVER}
    container_name: unicchat-documentserver
    restart: always
    depends_on:
      unicchat-postgresql:
        condition: service_healthy
      unicchat-rabbitmq:
        condition: service_healthy
    environment:
      ALLOW_META_IP_ADDRESS: true
      JWT_ENABLED: ${JWT_ENABLED}
      JWT_SECRET: ${JWT_SECRET}
      JWT_HEADER: ${JWT_HEADER}
      DB_TYPE: ${DB_TYPE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      AMQP_URI: ${AMQP_URI}
      ALLOW_PRIVATE_IP_ADDRESS: ${ALLOW_PRIVATE_IP_ADDRESS}
    volumes:
    - documentserver_data:/var/www/uniceditor/Data
    - documentserver_log:/var/log/uniceditor
    - documentserver_cache:/var/lib/uniceditor/documentserver/App_Data/cache/files
    - documentserver_files:/var/www/uniceditor/documentserver-example/public/files
    - documentserver_fonts:/usr/share/fonts
    networks:
    - unicchat-network
    stdin_open: true
    stop_grace_period: 60s
    ports:
    - 8880:80
    - 8443:443
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthcheck | grep -q true"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
  unicchat-postgresql:
    image: ${IMAGE_POSTGRES}
    container_name: unicchat-postgresql
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
    - postgresql_data:/var/lib/postgresql
    expose:
    - '5432'
    networks:
    - unicchat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
  unicchat-rabbitmq:
    image: ${IMAGE_RABBITMQ}
    container_name: unicchat-rabbitmq
    restart: always
    expose:
    - '5672'
    networks:
    - unicchat-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
networks:
  unicchat-network:
    name: unicchat-network
volumes:
  documentserver_cache:
    driver: local
  documentserver_files:
    driver: local
  postgresql_data:
    driver: local
  documentserver_log:
    driver: local
  documentserver_fonts:
    driver: local
  documentserver_data:
    driver: local
