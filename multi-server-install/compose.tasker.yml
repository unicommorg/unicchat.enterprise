# Роль Tasker. Запуск: docker compose -f compose.tasker.yml up -d
# Сверьте image: с docker-compose.yml.
services:
  unicchat-tasker:
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/unicchatkbasetasker:prod
    container_name: unicchat-tasker
    restart: always
    environment:
      api.vault.url: ${API_VAULT_URL}
      api.logger.url: ${API_LOGGER_URL}
    networks:
    - unicchat-network
    ports:
    - 8080:8080
networks:
  unicchat-network:
    name: unicchat-network
