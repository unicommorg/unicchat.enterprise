# Override: nginx и TLS снаружи (вариант B).
#
# Не поднимает unicchat-nginx (80/443 остаются свободны для host nginx / certbot).
# Публикует HTTP-порты приложений, чтобы внешний reverse proxy мог достучаться.
#
#   docker compose -f docker-compose.yml -f compose.external-nginx.yml up -d --wait
#
# Если nginx на том же хосте — ограничьте bind до 127.0.0.1 в этом файле
# (например "127.0.0.1:3000:3000") и не открывайте 3000/8081 снаружи.
# Если nginx на другой VM — оставьте как есть и режьте firewall до IP edge-хоста.

services:
  unicchat-nginx:
    profiles:
      - bundled-nginx

  unicchat-appserver:
    ports:
      - "3000:3000"

  unicchat-documentserver:
    ports:
      - "8081:80"
